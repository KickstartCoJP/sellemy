name: Change contract gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  change-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify staged code is inside change contract
        run: |
          python3 ops/change_contract_gate.py --base '${{ github.event.pull_request.base.sha }}' --head '${{ github.event.pull_request.head.sha }}' --destination refs/heads/pr
          python3 -m unittest discover -s tests -p 'test_change_contract_gate.py' -v
